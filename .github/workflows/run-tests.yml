name: Run tests

on:
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed: ${{ steps.set-matrix.outputs.changed }}
      frontend_changed: ${{ steps.set-matrix.outputs.frontend_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Collect changed Mossy services
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          files="$(
            git diff \
              --name-only \
              --diff-filter=ACMRT \
              "$BASE_SHA" \
              "$HEAD_SHA"
          )"

          if grep -q '^mossy-frontend/' <<< "$files"; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

          mapfile -t candidates < <(
            printf '%s\n' "$files" |
              awk -F/ '
                {
                  path = "."

                  for (i = 1; i <= NF; i++) {
                    path = path "/" $i

                    if ($i ~ /^mossy-/) {
                      if ($i != "mossy-frontend") {
                        print path
                      }

                      break
                    }
                  }
                }
              ' |
              sort -u
          )

          services=()

          for service in "${candidates[@]}"; do
            if [[ -f "$service/pom.xml" ]]; then
              services+=("$service")
            fi
          done

          if (( ${#services[@]} == 0 )); then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$(
            printf '%s\n' "${services[@]}" |
              jq -R -s -c '
                split("\n")
                | map(select(length > 0))
                | {
                    include: map({
                      service: .
                    })
                  }
              '
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  frontend-test:
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.frontend_changed == 'true'

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mossy-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mossy-frontend
        run: npm ci

      - name: Run tests
        working-directory: mossy-frontend
        run: npm test

  mvn-test:
    needs:
      - detect-changes

    if: needs.detect-changes.outputs.changed == 'true'

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Maven settings
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Run tests
        run: >-
          mvn -B -ntp
          -pl "${{ matrix.service }}"
          -am
          test
          -s /tmp/settings.xml

name: Build Docker images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-artifacts:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Maven settings
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build service jars
        run: mvn -B -ntp clean package -DskipTests -s /tmp/settings.xml

      - name: Upload service jars
        uses: actions/upload-artifact@v7
        with:
          name: service-jars
          path: |
            mossy-auth/target/*.jar
            mossy-password/target/*.jar
            mossy-key-sync/target/*.jar
            mossy-statistics/target/*.jar
            mossy-device-trust/target/*.jar
            mossy-mailer/target/*.jar
            self-hosted/mossy-vault/target/*.jar
          if-no-files-found: error

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build --workspace mossy-frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: mossy-frontend/dist
          if-no-files-found: error

  build-services:
    needs: build-artifacts
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - key-sync
          - password
          - statistics
          - auth
          - mailer
          - device-trust
          - vault

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download service jars
        uses: actions/download-artifact@v7
        with:
          name: service-jars
          path: .

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/dockerfile-${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ghcr.io/day-fit/mossy-${{ matrix.service }}:latest

  build-frontend:
    needs: build-artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: .

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mossy-frontend
          file: ./dockerfiles/dockerfile-frontend
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ghcr.io/day-fit/mossy-frontend:latest

  build-extension:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build distributable extension
        run: npm run extension:zip

      - name: Upload extension build
        uses: actions/upload-artifact@v7
        with:
          name: mossy-extension-chromium
          path: |
            mossy-extension/.output/chrome-mv3/
            mossy-extension/.output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

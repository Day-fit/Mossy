name: Feature request
description: Suggest a feature or setting for Mossy.
title: "[Feature] "
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposed-feature
    attributes:
      label: Proposed feature
      description: Describe the feature or setting you would like and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Have you considered another approach or a workaround?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or related issues if useful.

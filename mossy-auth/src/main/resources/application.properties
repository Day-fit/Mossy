spring.application.name=mossy-auth
server.port=8083
server.servlet.context-path=/api/v1/auth
server.forward-headers-strategy=native

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.username=${REDIS_USER:mossy}
spring.data.redis.host=${REDIS_HOST}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_PROVIDER_URI}

mossy.security.allowed-origins=${ALLOWED_ORIGINS}

mossy.jwks.path=/app/data/jwks.json

mossy.integration.device-trust-service.host=${MOSSY_DEVICE_TRUST_SERVICE_HOST:http://localhost:8086}

mossy.security.public-routes-patterns=/login,/register,/status,/refresh,/actuator/health,/.well-known/jwks.json

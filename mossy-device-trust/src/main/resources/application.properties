spring.application.name=mossy-device-trust
server.port=8085
server.servlet.context-path=/api/v1/device-trust

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:postgresql://${DB_URL}/${DB_NAME}
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.host=${REDIS_HOST}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_PROVIDER_URI}

mossy.security.allowed-origins=${ALLOWED_ORIGINS}
mossy.security.public-routes-patterns=/actuator/health

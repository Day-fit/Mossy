  <style>
    #message-flow { animation: mossy-message 12s linear infinite; }
    @keyframes mossy-message { to { stroke-dashoffset: -120; } }
    @media (prefers-reduced-motion: reduce) {
      #message-flow { animation: none; }
    }
  </style>
  <defs
     id="defs24" />
  <title
     id="title">A little home for your passwords</title>
  <desc
     id="description">
    Your devices exchange encrypted messages through Mossy with
    the vault on your own server. Your server stays yours, with
    no inbound ports to open.
</desc>
